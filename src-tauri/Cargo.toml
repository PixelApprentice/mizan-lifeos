[package]
name = "mizan"
version = "0.3.0"
description = "A local-first LifeOS planner"
authors = ["Mizan contributors"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/OWNER/mizan"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mizan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.4.1", features = ["sqlite"] }
tauri-plugin-shell = "2.3.6"
tauri-plugin-notification = "2.4.0"
chrono = "0.4.45"
tiny_http = "0.12"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite"] }
sha2 = "0.10"
getrandom = "0.2"

# Same version wry already uses; needed to recover when WebKit's renderer process dies.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_20"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwind (not abort) so a panic in a helper thread is logged to crash.log instead of
# killing the whole window.
panic = "unwind"
strip = true
